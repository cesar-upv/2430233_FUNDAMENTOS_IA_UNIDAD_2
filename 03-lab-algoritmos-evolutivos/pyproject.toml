[project]
name = "evolutionary-lab"
version = "0.1.0"
description = "Educational desktop laboratory for evolutionary algorithms"
authors = [
    { name = "César Euresti", email = "euresti.mgmt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
]

[project.scripts]
evolutionary-lab = "evolutionary_lab.presentation.app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
