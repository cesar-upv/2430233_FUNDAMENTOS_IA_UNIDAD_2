[project]
name = "ant-pathfinding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "César Euresti", email = "euresti.mgmt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
ant-pathfinding = "ant_pathfinding:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ant_pathfinding"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/ant_pathfinding"]
strict = true
warn_unreachable = true
warn_unused_configs = true
pretty = true
show_error_codes = true
show_error_context = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

qt_api = "pyside6"


[tool.coverage.run]
branch = true
source = ["ant_pathfinding"]

[tool.coverage.report]
show_missing = true
skip_covered = true

exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
