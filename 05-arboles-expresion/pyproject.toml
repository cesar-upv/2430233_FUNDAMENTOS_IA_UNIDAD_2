[project]
name = "expression-tree"
version = "0.1.0"
description = "Explorador visual de árboles de expresión y curvas"
authors = [
    { name = "César Euresti", email = "euresti.mgmt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
expression-tree = "expression_tree:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
